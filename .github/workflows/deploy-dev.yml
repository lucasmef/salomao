name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: salomao-deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sincronizar checkout dev
        run: |
          SYNC_CHECKOUT_DIRTY_POLICY=reset bash scripts/sync-checkout-to-ref.sh /srv/salomao/dev/app dev

      - name: Deploy dev
        env:
          SALOMAO_DEV_STANDBY: "1"
        run: |
          bash /srv/salomao/dev/app/scripts/deploy-dev.sh

      - name: Confirmar standby dev
        run: |
          sudo systemctl stop salomao-inter-dev.service || true
          if systemctl is-active --quiet salomao-dev.service; then
            echo "salomao-dev.service deveria estar parado em standby."
            exit 1
          fi
          if systemctl is-active --quiet salomao-inter-dev.service; then
            echo "salomao-inter-dev.service deveria estar parado em standby."
            exit 1
          fi
          echo "Deploy dev preparado; servicos dev do Salomao permanecem em standby."

