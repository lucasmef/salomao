name: Set Dev Safety Mode

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de seguranca do ambiente dev"
        required: true
        type: choice
        options:
          - safe
          - validate

permissions:
  contents: read

concurrency:
  group: salomao-deploy-dev
  cancel-in-progress: false

jobs:
  set-dev-safety-mode:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sincronizar checkout dev
        run: |
          SYNC_CHECKOUT_DIRTY_POLICY=reset bash scripts/sync-checkout-to-ref.sh /srv/salomao/dev/app dev

      - name: Aplicar modo ${{ inputs.mode }}
        env:
          SALOMAO_DEV_STANDBY: "1"
        run: |
          bash /srv/salomao/dev/app/scripts/set-dev-safety-mode.sh "${{ inputs.mode }}"

      - name: Confirmar standby dev
        run: |
          if systemctl is-active --quiet salomao-dev.service; then
            echo "::warning::salomao-dev.service ainda esta ativo. O workflow nao reiniciou o dev; pare com os comandos em docs/dev-standby.md."
          else
            echo "salomao-dev.service esta parado."
          fi
          if systemctl is-active --quiet salomao-inter-dev.service; then
            echo "::warning::salomao-inter-dev.service ainda esta ativo. Pare com os comandos em docs/dev-standby.md."
          else
            echo "salomao-inter-dev.service esta parado."
          fi
          echo "Modo ${{ inputs.mode }} aplicado sem reiniciar os servicos dev do Salomao."
