name: Sanitize Dev DB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salomao-deploy-dev
  cancel-in-progress: false

jobs:
  sanitize-dev-db:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sincronizar checkout dev
        run: |
          SYNC_CHECKOUT_DIRTY_POLICY=reset bash scripts/sync-checkout-to-ref.sh /srv/salomao/dev/app dev

      - name: Sanitizar banco dev
        run: |
          bash /srv/salomao/dev/app/scripts/sanitize-dev-db.sh

      - name: Confirmar standby dev
        run: |
          if systemctl is-active --quiet salomao-dev.service; then
            echo "::warning::salomao-dev.service ainda esta ativo. Este workflow nao reinicia o dev; pare com os comandos em docs/dev-standby.md."
          else
            echo "salomao-dev.service esta parado."
          fi
          if systemctl is-active --quiet salomao-inter-dev.service; then
            echo "::warning::salomao-inter-dev.service ainda esta ativo. Pare com os comandos em docs/dev-standby.md."
          else
            echo "salomao-inter-dev.service esta parado."
          fi
          echo "Sanitizacao do banco dev concluida sem reiniciar os servicos dev do Salomao."
