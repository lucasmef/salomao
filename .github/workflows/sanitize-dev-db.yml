name: Sanitize Dev DB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salomao-deploy-dev
  cancel-in-progress: false

jobs:
  sanitize-dev-db:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sincronizar checkout dev
        run: |
          SYNC_CHECKOUT_DIRTY_POLICY=reset bash scripts/sync-checkout-to-ref.sh /srv/salomao/dev/app dev

      - name: Sanitizar banco dev
        run: |
          bash /srv/salomao/dev/app/scripts/sanitize-dev-db.sh

      - name: Manter servico dev em standby
        run: |
          sudo systemctl stop salomao-dev.service || true
          sudo systemctl stop salomao-inter-dev.service || true

      - name: Confirmar standby dev
        run: |
          if systemctl is-active --quiet salomao-dev.service; then
            echo "salomao-dev.service deveria estar parado em standby."
            exit 1
          fi
          if systemctl is-active --quiet salomao-inter-dev.service; then
            echo "salomao-inter-dev.service deveria estar parado em standby."
            exit 1
          fi
          echo "Sanitizacao do banco dev concluida; servicos dev do Salomao permanecem em standby."
